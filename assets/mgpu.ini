[MGPU]
; ===========================================================================
; Atomic MGPU Bridge - settings
;
; Most of these are also in the add-on's panel in the ReShade overlay (Home),
; and changing them there is the easy way. Keep ONE line per setting: if a
; setting appears twice, the FIRST line is the one that counts.
; ===========================================================================

; ---- display ----
; DcompOverlay=0  the bridge shows the picture in its own window on top of the
;                 game. This is the recommended mode: it gets independent flip
;                 and works with G-SYNC (set G-SYNC to "full screen only").
; DcompOverlay=1  the picture is drawn onto the game's own window instead.
;                 One monitor only.
DcompOverlay=0
; Monitor=auto    the monitor plugged into the second (display) card.
; Monitor=0, 1..  pick a monitor by number if auto chooses the wrong one.
Monitor=auto
; PanelOverPicture=1  the ReShade panel (Home) opens on top of the picture,
;                     and the game ignores input while it is open.
PanelOverPicture=1
; PanelTheme=2  the mod's colours (graphite and teal) on its panel AND on all of ReShade's
;   windows (overrides ReShade's own style while the game runs). 1 = the mod's panel only.
;   0 = ReShade's colours everywhere.
PanelTheme=2
; PanelAnimations=1  game-menu motion in the panel: it fades and slides in when opened,
;   opened sections fade in, a teal ripple on clicks, and a title banner with a
;   pulsing status dot. 0 = still.
PanelAnimations=1
; PanelOnly=1  Home shows ONLY the MGPU panel, full height on the right (ReShade's
;   Home/Add-ons/Settings windows stay closed). Home or Esc closes it. For
;   ReShade's own menu: Shift+Home, or the "ReShade" button on the panel's
;   banner. 0 = as before: the panel inside ReShade's menu. Needs PanelOverPicture=1.
PanelOnly=1
; BridgeShowIdle=1  show the bridge window while it starts (by default it
;                   appears with the first picture).
; GameToFront=1     bring the game to the front when the bridge starts and at
;                   its first picture (once each). 0 = leave it where it opened.
GameToFront=1
; TrayIcon=1        a tray icon shows the status: grey waiting, amber arming,
;                   green running, red error. Click it for a menu. 0 = off.
TrayIcon=1
; HidePointer=0     1 = hide Windows' mouse pointer over the picture, for games
;                   that draw their own pointer (two pointers on screen).
HidePointer=0
Present=nr
PresentVsync=1
Window=FIT
NoActivate=2

; ---- game data sent to the second card ----
; Depth=1 needs mgpu_depth_tap.fx in ReShade's Shaders folder.
Depth=1
MVec=3
MVecScaleX=1.0
MVecScaleY=1.0
MVecDX=0.0
MVecDY=0.0
DepthInverted=1
MvecFromEval=2
JitterComp=0
; UT1. Where the bridge reads the game's motion vectors, depth and jitter.
;   0 auto (default): DLSS first; if the game is running XeSS or FSR 3.1
;     instead (DLSS off or not offered), read those. 1 DLSS only (old
;     behaviour). 2 XeSS only. 3 FSR only. -1 never read XeSS/FSR.
UpscalerTap=0
CopyQueue=2
Calib=2
CalibRung=0
RingWindow=1
Stride=0

; ---- neural rendering ----
Neural=1
; AS1. ArchSpoof - the DLSS-NR runtime refuses to start below RTX 50 by
;   asking the driver for the GPU architecture. 1 (default): that one answer
;   is "Blackwell" for the bridge's NR runtime on RTX 20/30/40 cards (RTX 50
;   is untouched). 0: the real architecture.
ArchSpoof=1
Passes=1
Intensity=2.00
PassReset=0
Tuning=0
ToneStrength=1.0
StructureStrength=1.0
SkinStrength=1.0
Style=0.0
AutoMask=1
Subrect=100
CostCurve=0

; TemporalStab=0  TC1. 0 off. 1 observe: history and shimmer
;   numbers only, the picture is unchanged. 2 stabilize: each real NR frame is
;   blended with its own motion-compensated history, before frame generation.
; TemporalStabStrength=30  most history a pixel gets (100 = 90%). Keep low:
;   DLSS-NR is already temporal. TemporalStabDebug=1 shows rejected history.
TemporalStab=0
TemporalStabStrength=30
TemporalStabDebug=0

; ---- super resolution on the second card ----
; Off: neural rendering runs at full display resolution (best picture).
; Turn it on in the panel, which sets SRScale and SRMvLowRes together -
; do not edit those two by hand.
SRUpscale=0
SRSnippet=1
SRPreset=0
SRQuality=2
SRScale=0
SRMvLowRes=2

; ---- latency ----
Reflex=0
ReflexSleep=0
ReflexLatency=0

; ---- automatic quality ----
Auto=0
AutoTargetFps=60

; ---- start and stop ----
; AutoArm=1 starts the bridge by itself once the game is running.
; AutoArm=0 waits for CTRL+ALT+F10 (press it in gameplay, not in a menu).
AutoArm=1
; Frames=0 runs until the game closes.
Frames=0

; ---- resolution changes (LR1) ----
; LiveResize=1 follows a DLSS quality or DLSS model change while you play
; (the game's render size or motion-vector format moves; the picture does
; not). 0 = restart the game after such a change, as before.
; ResizeRoom=1 sets memory aside at start so the render size can also grow
; (about 190 MB at 2560x1440). 0 = only smaller sizes are followed.
LiveResize=1
ResizeRoom=1

; ---- RivaTuner / overlay hooks and input recording (LR104) ----
; PresentGuardGame=1 (default): when a hook rewriting Windows' Present
; (RivaTuner/Afterburner) faults the GAME's own Present, skip that one frame
; instead of letting the game close - only if every safety check passes; if
; one fails, the game closes as it would have anyway. 0 = never step in; the
; log only says whether it would have been safe. The bridge's own Present is
; always guarded (PresentGuard=1). The sure fix for that crash: a RivaTuner
; profile for the game's exe with Application detection level = None.
PresentGuardGame=1
; InputHookPriority=0 (default) runs the input-path recorder's hook thread
; at normal priority; 1 = high priority (measured: no difference).
InputHookPriority=0

; ---- log ----
; DetailedLog=1 writes the full diagnostic log to ReShade.log. Turn it on
; (here or in the panel) before a run you want to report a problem with.
DetailedLog=0

; ---- leave these as they are ----
SwapGuard=0
MetaProbe=off
MetaProbeLogSeconds=3
MVecProbe=0
MVecProbeIndex=0
DepthCompare=0
Probes=0
Profile=0
ArmCrashed=0
ReflexApplied=0
